[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mrm-trace"
version = "0.1.0"
description = "LLM inference memory trace platform for MRM research"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "psutil>=5.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-xdist",
    "pytest-benchmark",
    "pytest-mock",
    "hypothesis>=6.0",
    "freezegun",
]
plots = [
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.scripts]
mrm-trace = "mrm_trace.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mrm_trace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, no I/O",
    "integration: may write temp files",
    "validity: scientific correctness assertions",
    "performance: throughput and memory benchmarks",
    "slow: requires model files on disk",
]
addopts = "-v --tb=short -m 'not slow and not performance'"

[tool.coverage.run]
source = ["mrm_trace"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 75
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
